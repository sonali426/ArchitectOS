name: ArchitectOS Resource Health
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional topic id to audit (example: kafka-streaming)'
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble curriculum
        run: node architectos/scripts/merge-topics.mjs
      - id: scan
        shell: bash
        run: |
          TOPIC="${{ inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            node architectos/scripts/resource-health.mjs --topic="$TOPIC" > /tmp/architectos-health.md
          else
            node architectos/scripts/resource-health.mjs > /tmp/architectos-health.md
          fi
          cat /tmp/architectos-health.md
      - name: Create or update freshness issue
        if: ${{ steps.scan.outputs.count != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/architectos-health.md', 'utf8');
            const title = '[ArchitectOS] Resource freshness queue';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
