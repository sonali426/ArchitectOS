name: ArchitectOS Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'architectos/**'
      - '.github/workflows/architectos-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: architectos-pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: architectos
      - run: npm run build
        working-directory: architectos
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: architectos/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
